<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leaderboard</title>
    <link rel="stylesheet" href="../css/pages/esports.css" />
  </head>
  <body>
    <main class="dashboard-container">
      <section class="stats">
        <p class="title">GLOBAL STATS</p>

        <div class="stat-card-item">
          <img src="../assets/images/home page images/users.png" width="30px" />
          <div class="stat-info">
            <p>TOTAL PLAYERS</p>
            <h4>4.8M+</h4>
          </div>
        </div>

        <div class="stat-card-item">
          <img src="../assets/images/home page images/eye.png" width="30px" />
          <div class="stat-info">
            <p>ONLINE NOW</p>
            <h4>215K+</h4>
          </div>
        </div>

        <div class="stat-card-item">
          <img src="../assets/images/home page images/Frame.png" width="30px" />
          <div class="stat-info">
            <p>TOTAL GAMES</p>
            <h4>1.9B+</h4>
          </div>
        </div>

        <p class="title">TOP GAME WEEK</p>

        <div class="game-card">
          <h4>Hyperstrike</h4>
          <p>Top Played: 45,210 Active players</p>
          <button class="join-btn">JOIN MATCH</button>
        </div>
      </section>

      <section class="leaderboard">
        <h1 class="leaderboard-top">GLOBAL LEADERBOARD</h1>

        <div class="tabs">
          <p>WEEKLY</p>
          <p>MONTHLY</p>
          <button class="active-tab">ALL-TIME</button>
          <button class="butt">filters:All</button>
        </div>
        <div class="table-container">
         <div class="table-container">
    <div class="table-header">
        <p>RANK</p>
        <p>PLAYER</p>
        <p>SCORE</p>
        <p>GAMES</p>
        <p>WIN RATE</p>
    </div>
      </section>
    </main>
  </body>
</html>
