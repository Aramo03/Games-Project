<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./assets/images/headerPic.png" type="headerPic/png">
    <title>Arcade</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <section class="arcade-section-3">
        <div class="arcade-title-contain">
            <div class="arcade-title">POPULAR GAMES</div>
            <div class="arcade-description">TOP PICKS OF THE WEEK</div>
        </div>
        <div class="arcade-cards">
            <div class="arcade-card1-contain">
                <img src="" alt="" class="arcade-img">
                <div class="arcade-card1-description-container">
                    <div class="arcade-card1-description-container-type-rate">
                        <div class="arcade-card1-game-type">Retro Classic</div>
                        <div class="arcade-card1-game-rate">4.8</div>
                    </div>
                    <div class="arcade-card1-description2-container">
                        <div class="arcade-card1-description2-title">SNAKE RETRO</div>
                        <div class="arcade-card1-description2-description">Classic arcade action reimagined with high-contrast neon lines.</div>
                    </div>
                    <div class="arcade-card1-active-s-button">
                        <div class="arcade-card1-active">1.2k playing</div>
                        <button type="button" class="btn arcade-btn">PLAY</button>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
