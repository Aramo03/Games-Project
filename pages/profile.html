<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ero</title>
    <link rel="stylesheet" href="/css/pages/profile.css">
</head>

<body >

    <main>
        <!-- профиль -->

        <section class="profile">

            <!-- баннер профиля -->
            <div class="profileBanner">

                <div class="profileBannerImage">

                </div>

            </div>


            <!-- профиль инфо -->
            <div class="profileInfo">

                <!-- ава профиля -->
                <div class="profileAvatar"></div>


                <!-- юзер инфо -->
                <div class="profileUser">

                    <div class="profileName">
                        <p>PhantomStrike</p>
                    </div>

                    <div class="profileLevel">
                        <p>Lv. 42</p>
                    </div>

                    <div class="profileStatus">
                        <p>Online</p>
                    </div>



                </div>


                <!-- профиль кнопки -->
                <div class="profileActions">

                    <div class="profileButton"> <input class="profileFriendButton" type="button" value="Add friend">
                    </div>

                    <div class="profileButton"><input class="profileMessageButton" type="button" value="Message"></div>

                </div>



                <!-- поинт прогресс -->
                <div class="profileXp">

                    <div class="profileXpHeader">
                        <div></div>
                        <div></div>
                    </div>

                    <div class="profileXpBar">
                        <div class="profileXpProgress"></div>
                    </div>

                </div>


                <!-- статистика профиля -->
                <div class="profileStats">

                    <div class="profileStat">
                        <div>
                            <p>168</p>
                        </div>
                        <div>
                            <p>games owned</p>
                        </div>
                    </div>

                    <div class="profileStat">
                        <div>
                            <p>20,000</p>
                        </div>
                        <div>
                            <p>hours played</p>
                        </div>
                    </div>

                    <div class="profileStat">
                        <div>
                            <p>1,256</p>
                        </div>
                        <div>
                            <p>achievements</p>
                        </div>
                    </div>

                    <div class="profileStat">
                        <div>
                            <p>45</p>
                        </div>
                        <div>
                            <p>friends</p>
                        </div>
                    </div>

                    <div class="profileStat">
                        <div>
                            <p>34</p>
                        </div>
                        <div>
                            <p>reviews</p>
                        </div>
                    </div>

                </div>
            </div>

        </section>



        <!-- RECENTLY PLAYED  -->

        <section class="recentlyPlayed">

            <!-- заголовок -->
            <div class="sectionHeader">

                <p> Recently Played</p>

            </div>


            <!-- игры -->
            <div class="recentlyPlayedGames">

                <article class="gameCard">

                    <div class="gameCardImage"></div>

                    <div class="gameCardInfo">

                        <div class="gameCardTitle"></div>

                        <div class="gameCardPlayed"></div>

                        <div class="gameCardHours"></div>

                    </div>

                    <div class="gameCardProgress">

                        <div class="gameCardProgressBar">
                            <div></div>
                        </div>

                    </div>

                </article>


                <article class="gameCard">

                    <div class="gameCardImage"></div>

                    <div class="gameCardInfo">

                        <div class="gameCardTitle"></div>

                        <div class="gameCardPlayed"></div>

                        <div class="gameCardHours"></div>

                    </div>

                    <div class="gameCardProgress">

                        <div class="gameCardProgressBar">
                            <div></div>
                        </div>

                    </div>

                </article>


                <article class="gameCard">

                    <div class="gameCardImage"></div>

                    <div class="gameCardInfo">

                        <div class="gameCardTitle"></div>

                        <div class="gameCardPlayed"></div>

                        <div class="gameCardHours"></div>

                    </div>

                    <div class="gameCardProgress">

                        <div class="gameCardProgressBar">
                            <div></div>
                        </div>

                    </div>

                </article>


                <article class="gameCard">

                    <div class="gameCardImage"></div>

                    <div class="gameCardInfo">

                        <div class="gameCardTitle"></div>

                        <div class="gameCardPlayed"></div>

                        <div class="gameCardHours"></div>

                    </div>

                    <div class="gameCardProgress">

                        <div class="gameCardProgressBar">
                            <div></div>
                        </div>

                    </div>

                </article>

            </div>

        </section>
    </main>
</body>

</html>
